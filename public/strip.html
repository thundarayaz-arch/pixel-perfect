<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Black Friday Sale Strip</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; }
  body { display: grid; place-items: center; font-family: 'Inter', sans-serif; }

  .strip {
    width: 100%;
    background: #000000;
    overflow: hidden;
    padding: 28px 0;
  }

  .track {
    display: flex;
    width: max-content;
    animation: scroll 12s linear infinite;
  }

  .group {
    display: flex;
    align-items: center;
    white-space: nowrap;
  }

  .item {
    display: flex;
    align-items: center;
    color: #ffffff;
    font-size: 64px;
    font-weight: 500;
    padding-right: 90px;
  }

  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div class="strip">
  <div class="track" id="track">
    <div class="group">
      <div class="item">Black Friday Sale</div>
      <div class="item">Black Friday Sale</div>
      <div class="item">Black Friday Sale</div>
    </div>
    <div class="group" aria-hidden="true">
      <div class="item">Black Friday Sale</div>
      <div class="item">Black Friday Sale</div>
      <div class="item">Black Friday Sale</div>
    </div>
  </div>
</div>
</body>
</html>
